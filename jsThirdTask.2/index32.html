<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style32.css">
</head>
<body>

    <select id="fontType">
        <option value="Fantasy">Fantasy</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="monospace">Monospace</option>
    </select>

    <select id="fontSize">
        <option value="10px">10px</option>
        <option value="15px">15px</option>
        <option value="20px">20px</option>
        <option value="25px">25px</option>
    </select>

    <input type="checkbox" id="chkItalic"> Italic
    <input type="checkbox" id="chkBold"> Bold
    <input type="checkbox" id="chkUnderline"> Underline

    <div id="container">
        <p id="paragraph">the quick brown fox over the lazy dog</p>
    </div>

    <script src="java32.js"></script>
</body>
</html>
